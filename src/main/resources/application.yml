spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/subscriptions}
    username: ${DB_USER:subs}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
